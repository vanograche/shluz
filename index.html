<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Шлюз подписок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Одна колонка как телефон (≤440px), плавающая нижняя навигация, шторки снизу */
:root{
  --bg:#eceee9; --surface:#ffffff; --surface2:#f4f5f1; --ink:#11151b; --muted:#5b636c; --line:#dcdfd8;
  --accent:#2445c9; --accent-ink:#ffffff; --accent-soft:#e3e8fb;
  --ok:#17784f; --ok-soft:#dff1e8; --stop:#c43328; --stop-soft:#f9e1de; --warn:#9a5c00; --warn-soft:#fbeed6; --pause:#2f6db5; --pause-soft:#e1ecf8;
  --shadow:0 1px 2px rgba(17,21,27,.06),0 8px 24px rgba(17,21,27,.06);
  --f-disp:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1115; --surface:#171b21; --surface2:#1e232b; --ink:#edf0f3; --muted:#97a0aa; --line:#29303a;
  --accent:#7d95ff; --accent-ink:#0c1020; --accent-soft:#1f2747;
  --ok:#41c98c; --ok-soft:#14301f; --stop:#ff6b5d; --stop-soft:#3a1714; --warn:#f0a73a; --warn-soft:#33240c; --pause:#79b0f2; --pause-soft:#16263a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) 110px;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
.word{font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.word i{width:22px;height:22px;border-radius:7px;background:var(--ink);display:inline-grid;place-items:center}
.word i::after{content:"";width:8px;height:12px;border:2.5px solid var(--bg);border-radius:2px}
.ava{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:20px}
.muted{color:var(--muted)}
.wallet{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px;display:grid;gap:12px}
.wallet small{opacity:.72;font-size:13px}
.wallet .big{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.wallet .r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wallet .top-up{background:var(--bg);color:var(--ink);padding:10px 16px;border-radius:99px;font-weight:600;white-space:nowrap}
.wallet .auto{font-size:13px;opacity:.85;border-top:1px solid rgba(127,127,127,.3);padding-top:10px}
.banner{display:grid;gap:10px;background:var(--stop-soft);border-radius:16px;padding:13px 14px;margin-top:12px;text-align:left;width:100%}
.banner.warn{background:var(--warn-soft)}
.banner .h{display:flex;gap:10px;align-items:flex-start}
.banner .ic{font-size:20px;line-height:1.2}
.banner b{display:block}
.banner .btns{display:flex;gap:8px}
.banner .btns button{flex:1;padding:10px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface)}
.banner .btns button.pri{background:var(--ink);color:var(--bg)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px;gap:10px}
.sec h3{font-size:16px}
.list{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0}
.row .nm{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .sub{font-size:13px;color:var(--muted)}
.row.off .nm,.row.off .logo{opacity:.5}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff;letter-spacing:-.02em}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.tag.blue{background:var(--pause-soft);color:var(--pause)}
.tag.grey{background:var(--surface2);color:var(--muted)}
.sw{width:51px;height:31px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(20px)}
.sw.pause{background:var(--pause-soft)}
.add{margin-top:12px;width:100%;padding:15px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:600;font-size:16px;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.red{background:var(--stop);color:#fff}
.btn.green{background:var(--ok);color:#fff}
.btn.blue{background:var(--pause);color:#fff}
.btn small{display:block;font-weight:400;opacity:.8;font-size:13px}
.stack{display:grid;gap:10px}
.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.tabs nav{pointer-events:auto;display:flex;gap:4px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);border-radius:99px;padding:5px;width:100%;max-width:440px}
.tabs button{flex:1;padding:9px 6px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.tabs .dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:9px;background:var(--stop);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.back{display:inline-flex;gap:6px;align-items:center;padding:8px 14px 8px 10px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;margin-block:14px 6px}
.dhead{display:flex;gap:14px;align-items:center;margin-block:14px}
.dhead .logo{width:56px;height:56px;border-radius:16px;font-size:18px}
.dhead h2{font-size:24px}
.panel{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-top:12px}
.trow{display:flex;align-items:center;gap:12px}
.trow .txt{flex:1;min-width:0}
.trow b{display:block;font-size:16px}
.vcard{margin-top:12px;border-radius:20px;padding:18px;color:#fff;aspect-ratio:1.586;width:100%;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.vcard::before{content:"";position:absolute;right:-30%;top:-40%;width:90%;height:120%;border-radius:50%;background:rgba(255,255,255,.12)}
.vcard.off{filter:grayscale(1) brightness(.75)}
.vcard .r1{display:flex;justify-content:space-between;align-items:center;position:relative;gap:8px}
.vcard .brand{font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.08em}
.vcard .svc{font-size:12.5px;opacity:.9;font-weight:600;text-align:right}
.vcard .num{font-family:var(--f-mono);font-size:clamp(15px,5.2vw,21px);letter-spacing:.05em;position:relative}
.vcard .r3{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;position:relative}
.vcard .r3 b{font-family:var(--f-mono);font-size:14px;display:block}
.vcard .lock{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;background:rgba(0,0,0,.35)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.kv:first-child{border-top:0;padding-top:2px}
.kv>span:first-child{color:var(--muted)}
.kv b,.kv .lnk{text-align:right}
.lnk{color:var(--accent);font-weight:600}
.copy{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:12px;font-family:var(--f-mono);font-size:15px}
.copy small{font-family:var(--f-body);color:var(--muted);display:block;font-size:12px}
.copy button{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:99px;background:var(--accent-soft)}
.demo{border:1.5px dashed var(--line);border-radius:18px;padding:14px;margin-top:18px;display:grid;gap:8px}
.demo p{margin:0;font-size:13px;color:var(--muted)}
.demo button{padding:11px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:14px;text-align:left}
.danger{display:block;margin:20px auto 0;color:var(--stop);font-weight:600;padding:10px}
.ev{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.ev:first-child{border-top:0}
.ev .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:15px}
.ic.ok{background:var(--ok-soft);color:var(--ok)}
.ic.block{background:var(--stop-soft);color:var(--stop)}
.ic.info{background:var(--surface2);color:var(--muted)}
.ic.pause{background:var(--pause-soft);color:var(--pause)}
.ev .txt{flex:1;min-width:0}
.ev .t{font-weight:600}
.ev .d{font-size:13px;color:var(--muted)}
.ev .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.cut{color:var(--stop);text-decoration:line-through}
.amt.plus{color:var(--ok)}
.ev .more{display:block;font-size:13px;color:var(--accent);font-weight:600;margin-top:4px}
.day{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.saved{background:var(--ok-soft);color:var(--ok);border-radius:22px;padding:18px}
.saved .big{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1.05;margin-block:4px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.steps{display:grid;gap:14px}
.step{display:flex;gap:12px}
.step>b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px}
.step p{margin:3px 0 0}
.plan{background:linear-gradient(135deg,var(--accent),#5a2bb8);color:#fff;border-radius:22px;padding:18px;margin-top:12px;display:grid;gap:10px}
.plan .big{font-family:var(--f-disp);font-size:22px;font-weight:700}
.plan .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.plan .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.plan button{justify-self:start;background:#fff;color:#2b2b93;padding:9px 16px;border-radius:99px;font-weight:600}
.minicard{width:44px;height:30px;border-radius:6px;background:linear-gradient(135deg,#ffdd2d,#f5b800);flex:none;position:relative}
.minicard::after{content:"";position:absolute;left:6px;top:9px;width:9px;height:7px;border-radius:2px;background:rgba(0,0,0,.25)}
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sh-hd{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 10px;z-index:2}
.sh-hd h2{font-size:19px}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface2);flex:none;font-size:16px}
.sheet p{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid button{background:var(--surface2);border-radius:16px;padding:12px 6px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center}
.grid button:disabled{opacity:.4;cursor:default}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field input{font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{padding:8px 12px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:14px}
.chips button.on{background:var(--ink);color:var(--bg)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:16px;background:var(--surface2);border:2px solid transparent}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .e{font-size:24px;line-height:1}
.opt b{display:block}
.opt span.muted{font-size:13.5px}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:20px;border-radius:4px}
.howto{counter-reset:s;display:grid;gap:8px;margin:14px 0}
.howto div{display:flex;gap:10px;align-items:baseline}
.howto div::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center}
.onb-pic{height:140px;border-radius:20px;background:var(--surface2);display:grid;place-items:center;margin:4px 0 16px;font-size:52px}
.tariff{display:grid;gap:4px;text-align:left;width:100%;padding:14px;border-radius:16px;background:var(--surface2);border:2px solid transparent}
.tariff.on{border-color:var(--accent);background:var(--accent-soft)}
.tariff .p{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tariff .p b{font-size:17px}
.tariff ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.faceid{display:grid;place-items:center;gap:8px;padding:10px 0 16px}
.faceid i{width:72px;height:72px;border-radius:20px;border:3px solid var(--accent);display:grid;place-items:center;font-style:normal;font-size:30px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;z-index:60;font-weight:600;max-width:min(400px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease-out;cursor:pointer}
.toast small{display:block;font-weight:400;opacity:.78}
@keyframes tin{from{transform:translate(-50%,-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* v5: одна карта */
.month{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px;display:grid;gap:12px}
.month small{opacity:.72;font-size:13px}
.month .big{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.month .r{display:flex;justify-content:space-between;align-items:center;gap:12px}
.month .mc{display:flex;align-items:center;gap:8px;background:rgba(127,127,127,.22);border-radius:12px;padding:8px 10px;font-family:var(--f-mono);font-size:13px;color:inherit}
.month .mc i{width:26px;height:17px;border-radius:4px;background:linear-gradient(135deg,#2445ff,#5a2bb8);display:block}
.month .st{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid rgba(127,127,127,.3);padding-top:12px}
.month .st b{font-size:16px}
.month .st .lack{color:#ff8a80}
.month .st .okk{color:#7ee2a8}
.month .st button{background:var(--bg);color:var(--ink);padding:10px 16px;border-radius:99px;font-weight:600;white-space:nowrap}
.month .auto{font-size:13px;opacity:.8}
.mycard{border-radius:20px;padding:18px;color:#fff;aspect-ratio:1.586;width:100%;background:linear-gradient(135deg,#2445ff,#5a2bb8);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px rgba(36,69,255,.25);margin-top:12px;position:relative;overflow:hidden}
.mycard::before{content:"";position:absolute;right:-30%;top:-40%;width:90%;height:120%;border-radius:50%;background:rgba(255,255,255,.12)}
.mycard .brand{font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.08em;position:relative}
.mycard .num{font-family:var(--f-mono);font-size:clamp(15px,5.2vw,21px);letter-spacing:.05em;position:relative}
.mycard .r3{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;position:relative}
.mycard .r3 b{font-family:var(--f-mono);font-size:14px;display:block}
.ask{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:10px;margin-top:12px;border:2px solid var(--warn-soft)}
.ask .h{display:flex;gap:12px;align-items:center}
.ask b{display:block}
.ask .btns{display:flex;gap:8px}
.ask .btns button{flex:1;padding:11px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface2)}
.ask .btns button.pri{background:var(--ink);color:var(--bg)}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk span{flex:1;font-weight:600}
</style>

<script>
/* Шлюз — прототип. Одна виртуальная карта для всех подписок, у каждой подписки свой переключатель.
   Данные вымышленные, состояние хранится в браузере. */
const NB=' ';
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MON_P=['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const SVC={
  yplus:{name:'Яндекс Плюс',price:449,c:'linear-gradient(135deg,#ff5a36,#c3171f)',ab:'Я+',mid:'YANDEX*PLUS'},
  ivi:{name:'Иви',price:399,c:'linear-gradient(135deg,#ef2d7a,#9e0b4c)',ab:'ив',mid:'IVI.RU'},
  okko:{name:'Okko',price:399,c:'linear-gradient(135deg,#7b4dff,#3a17a8)',ab:'Ok',mid:'OKKO.TV'},
  start:{name:'START',price:299,c:'linear-gradient(135deg,#3b3f47,#111317)',ab:'ST',mid:'START.RU'},
  vkm:{name:'VK Музыка',price:199,c:'linear-gradient(135deg,#2d8cff,#0a4fc2)',ab:'VK',mid:'VK*MUSIC'},
  litres:{name:'Литрес',price:399,c:'linear-gradient(135deg,#ff8a1f,#d0520a)',ab:'Лр',mid:'LITRES.RU'},
  kion:{name:'KION',price:249,c:'linear-gradient(135deg,#9a2bd8,#4d0f7c)',ab:'KN',mid:'KION.RU'},
  wink:{name:'Wink',price:349,c:'linear-gradient(135deg,#ff6f3c,#a8340f)',ab:'W',mid:'WINK.RU'},
  premier:{name:'PREMIER',price:299,c:'linear-gradient(135deg,#25b07a,#0d6646)',ab:'PR',mid:'PREMIER.ONE'},

const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const rub=n=>Math.round(n).toLocaleString('ru-RU').replace(/\s/g,NB)+NB+'₽';
const fdate=d=>(d=new Date(d),d.getDate()+NB+MON[d.getMonth()]);
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return (m==1&&h!=11)?a:(m>=2&&m<=4&&(h<12||h>14))?b:c};
const r4=()=>String(1000+Math.floor(Math.random()*9000));

function mkCard(){const l=r4();return{num:'2200 7'+r4().slice(1)+' '+r4()+' '+l,last4:l,exp:String(1+Math.floor(Math.random()*12)).padStart(2,'0')+'/'+String((today().getFullYear()+3)%100),cvc:String(100+Math.floor(Math.random()*900))}}
function nextCharge(s){if(s.trial&&s.trial>=today().getTime())return new Date(s.trial);if(!s.day)return null;const t=today();let d=new Date(t.getFullYear(),t.getMonth(),s.day);if(d<t)d=new Date(t.getFullYear(),t.getMonth()+1,s.day);return d}
function pauseOver(s){if(s.state=='pause'&&s.pauseUntil&&s.pauseUntil<=today().getTime()){s.state='on';delete s.pauseUntil}}

const sw=s=>`<button class="sw ${s.state=='on'?'on':s.state=='pause'?'pause':''}" role="switch" aria-checked="${s.state=='on'}" aria-label="${esc(s.name)}: ${s.state=='on'?'включена':s.state=='pause'?'на паузе':'выключена'}" data-tog="${s.id}"></button>`;
const trialOn=s=>s.trial&&s.trial>=today().getTime();

function subLine(s){
  if(s.state=='off')return 'Выключена — списания не пускаем';
  if(s.state=='pause')return 'Пауза до '+fdate(s.pauseUntil)+' — потом включится сама';
  if(trialOn(s))return 'Пробный до '+fdate(s.trial)+'<br>Первое платное списание — '+rub(s.price);
  const d=nextCharge(s);
  if(!d)return 'Ждём первое списание';
  return fdate(d)+' · '+rub(s.price);
}
/* прогноз месяца: что ещё спишут до конца месяца */
function monthPlan(){
  const t=today(),end=new Date(t.getFullYear(),t.getMonth()+1,0);
  const list=S.subs.filter(s=>s.state=='on').map(s=>({s,d:nextCharge(s)})).filter(x=>x.d&&x.d<=end).sort((a,b)=>a.d-b.d);
  const total=list.reduce((a,x)=>a+x.s.price,0);
  let bal=S.wallet,first=null;for(const x of list){if(bal<x.s.price&&!first)first=x;bal-=x.s.price}
  return{list,total,lack:Math.max(0,total-S.wallet),first};
}
/* сколько не дали списать: каждый сервис один раз за месяц, при подорожании — только разница */
function savedSum(){const seen={};let sum=0,n=0;
  S.ev.forEach(e=>{if(e.k!='block'&&e.k!='limit')return;const d=new Date(e.t),key=e.sub+'|'+d.getFullYear()+'-'+d.getMonth();if(seen[key])return;seen[key]=1;n++;sum+=e.k=='limit'?e.amt-e.lim:e.amt});
  return{sum,n}}

/* ---------- главный экран ---------- */
function home(){

    <div class="st"><div><small>На карте ${rub(S.wallet)}</small><br>${P.lack?`<b class="lack">Не хватает ${rub(P.lack)}</b>`:`<b class="okk">Хватает ✓</b>`}</div><button data-act="topup">Пополнить</button></div>
    ${P.lack?`<div class="auto">${S.auto&&P.first?`Автопополнение: доложим ${rub(P.lack)} с ${esc(S.source.bank)} •• ${S.source.last4} ${fdate(addDays(P.first.d,-1))}`:'Автопополнение выключено — пополни до '+(P.first?fdate(P.first.d):'конца месяца')}</div>`:''}

  h+=`<button class="add" data-act="add">＋ Подключить подписку</button>`;

    <div class="kv"><span>Как узнаём в списании</span><b style="font-family:var(--f-mono);font-size:14px">${esc(s.mid||'по первому списанию')}</b></div>

const copyRow=(l,v)=>`<div class="copy"><span><small>${l}</small>${v}</span><button data-copy="${v.replace(/\s/g,'')}">Копировать</button></div>`;
function cardBox(rev){const c=S.card;return `<div class="mycard"><span class="brand">ШЛЮЗ</span><div class="num">${rev?c.num:'•••• •••• •••• '+c.last4}</div><div class="r3"><span>Срок<b>${rev?c.exp:'••/••'}</b></span><span>CVC<b>${rev?c.cvc:'•••'}</b></span><span style="font-weight:700;font-size:14px">МИР</span></div></div>`}

/* ---------- события ---------- */
function evMeta(e){
  const s=sub(e.sub)||{name:e.name||'Сервис'};const n=esc(s.name);
  return {
    ok:[e.st=='pending'?'info':'ok',e.st=='pending'?'…':'✓',`${n} списал`,e.st=='pending'?'В обработке — деньги отложены, проведём за 1–3 дня':'Проведено',`<span class="amt">−${rub(e.amt)}</span>`],
    block:['block','✕',`${n} пытался списать — не пустили`,e.why||'Подписка выключена',`<span class="amt cut">${rub(e.amt)}</span>`],
    limit:['block','✋',`${n} хотел ${rub(e.amt)} — не пустили`,`Обычная цена — ${rub(e.lim)}`+(e.allowed?' · пропустили один раз':''),`<span class="amt cut">${rub(e.amt)}</span>`],
    unknown:[e.st=='allowed'?'ok':'block','?',`Новый сервис ${esc(e.name)} хотел ${rub(e.amt)}`,e.st=='ask'?'Не пустили — ждём твоего ответа':e.st=='allowed'?'Разрешено — добавили в подписки':'Запрещено',`<span class="amt ${e.st=='allowed'?'':'cut'}">${rub(e.amt)}</span>`],
    refund:['ok','↩',`${n} вернул деньги`,'Лежат на карте Шлюза',`<span class="amt plus">+${rub(e.amt)}</span>`],
    topup:['info','＋','Пополнили карту',e.how||'',`<span class="amt plus">+${rub(e.amt)}</span>`],
    off:['info','⏻',`${n}: выключена`,'Списания не пускаем',''],
    on:['ok','⏻',`${n}: включена`,'Списания снова пускаем',''],
    pause:['pause','⏸',`${n}: пауза`,'До '+(e.until?fdate(e.until):'')+' — потом включится сама',''],
    add:['info','＋',`${n}: подключена`,'Ждём первое списание',''],
    remove:['info','✕',`${n}: убрана из Шлюза`,'Списания больше не пускаем',''],
    reissue:['info','▭','Новая карта Шлюза','Старая закрыта. Вставь новую в свои подписки',''],
    dispute:['pause','?',`Спорное списание ${n}`,DSP[e.stage||0][0],`<span class="amt">${rub(e.amt)}</span>`],
    credit:['ok','↩',`Временно вернули деньги за ${n}`,'Пока банк разбирается — деньги твои',`<span class="amt plus">+${rub(e.amt)}</span>`],
  }[e.k];
}
function evRow(e,cnt){
  const M=evMeta(e);const tm=new Date(e.t),time=String(tm.getHours()).padStart(2,'0')+':'+String(tm.getMinutes()).padStart(2,'0');
  return `<div class="ev"><span class="ic ${M[0]}">${M[1]}</span><div class="txt"><div class="t">${M[2]}${cnt>1?` · ${cnt}${NB}${plural(cnt,'раз','раза','раз')}`:''}</div><div class="d">${M[3]} · ${time}</div>${e.k=='ok'&&!e.disputed?`<button class="more" data-dispute="${e.t}">Не узнаю это списание ›</button>`:''}${e.k=='dispute'?`<button class="more" data-dtrack="${e.t}">Где сейчас заявка ›</button>`:''}</div>${M[4]}</div>`;
}
function events(){
  S.seenEv=Date.now();save();
  const asks=S.ev.filter(e=>e.k=='unknown'&&e.st=='ask').sort((a,b)=>b.t-a.t);
  const lim=S.ev.filter(e=>e.k=='limit'&&e.open).sort((a,b)=>b.t-a.t);
  const sv=savedSum();
  let h=`<div class="top"><div class="word"><i></i>Шлюз</div></div>`;
  asks.forEach(e=>{h+=`<div class="ask"><div class="h">${logo({svc:e.svc,name:e.name})}<div><b>Новый сервис ${esc(e.name)} хочет ${rub(e.amt)}</b><span class="muted">Пока не пустили. Это твоя подписка?</span></div></div><div class="btns"><button class="pri" data-allow="${e.t}">Разрешить</button><button data-deny="${e.t}">Запретить</button></div></div>`});
  lim.forEach(e=>{const s=sub(e.sub);if(!s)return;h+=`<div class="ask"><div class="h">${logo(s)}<div><b>${esc(s.name)} хочет ${rub(e.amt)}</b><span class="muted">Обычно ${rub(e.lim)}. Не пустили</span></div></div><div class="btns"><button class="pri" data-once="${e.t}">Пропустить один раз</button><button data-keep="${e.t}">Не пускать</button></div></div>`});
  h+=`<div class="saved" style="margin-top:12px"><div>Не дали списать</div><div class="big">${rub(sv.sum)}</div><div>Повторные попытки одного сервиса за месяц считаем один раз</div></div>`;
  const ev=[...S.ev].filter(e=>!(e.k=='unknown'&&e.st=='ask')&&!(e.k=='limit'&&e.open)).sort((a,b)=>b.t-a.t);
  let cur='',open=false;
  for(let i=0;i<ev.length;i++){
    const e=ev[i];const d=new Date(e.t);d.setHours(0,0,0,0);
    const lbl=d.getTime()==today().getTime()?'Сегодня':d.getTime()==addDays(today(),-1).getTime()?'Вчера':fdate(d);
    const key=x=>x.k=='block'?x.sub+'|'+new Date(x.t).toDateString():null;
    if(key(e)&&ev.slice(0,i).some(x=>key(x)==key(e)))continue;
    if(lbl!=cur){if(open)h+='</div>';h+=`<div class="day">${lbl}</div><div class="list">`;cur=lbl;open=true}
    h+=evRow(e,key(e)?ev.filter(x=>key(x)==key(e)).length:1);
  }
  if(open)h+='</div>';
  h+=`<div class="demo"><p>Для показа</p><button data-act="simunknown">▶ Незнакомый сервис пробует списать деньги</button></div>`;
  return h;
}

    <div class="step"><b>1</b><div><strong>Одна карта Шлюза</strong><p class="muted">Виртуальная, прямо в приложении</p></div></div>

    <div class="step"><b>3</b><div><strong>Вставляешь её в подписки</strong><p class="muted">Okko, Иви, Яндекс Плюс — один номер везде</p></div></div>
    <div class="step"><b>4</b><div><strong>Управляешь переключателями</strong><p class="muted">Включено и по обычной цене — пропускаем. Выключено, дороже или незнакомый сервис — не пускаем и пишем тебе</p></div></div>
  </div>
  <p class="note">Подписки через оператора связи и App Store идут мимо карты — их Шлюз не видит</p>
  <div class="stack" style="margin-top:16px"><button class="btn ghost" data-act="onb">Показать знакомство ещё раз</button><button class="btn ghost" data-act="reset">Начать демо заново</button><button class="btn ghost" data-act="closeacc">Закрыть Шлюз</button><button class="btn ghost" data-act="logout" style="color:var(--stop)">Выйти</button></div>`;
}

/* ---------- отрисовка ---------- */
function render(){
  const app=document.getElementById('app');
  app.innerHTML=view.sub&&sub(view.sub)?detail(sub(view.sub)):view.tab=='events'?events():view.tab=='profile'?profile():home();
  const need=S.ev.filter(e=>(e.k=='unknown'&&e.st=='ask')||(e.k=='limit'&&e.open)).length+S.ev.filter(e=>e.k=='block'&&e.t>S.seenEv).length;
  const T=[['home','Подписки','▤'],['events','Что было','🛡'],['profile','Профиль','◉']];
  document.getElementById('tabs').innerHTML=T.map(([k,l,i])=>`<button class="${view.tab==k?'on':''}" data-tab="${k}"><span aria-hidden="true">${i}</span>${l}${k=='events'&&need&&view.tab!='events'?`<span class="dot">${need}</span>`:''}</button>`).join('');
}
function go(tab){view={tab,sub:null,reveal:false};render();scrollTo(0,0)}
function openSub(id){view={tab:'home',sub:id,reveal:false};render();scrollTo(0,0)}

let scrimEl=null;
function sheet(title,body){
  if(!scrimEl){scrimEl=document.createElement('div');scrimEl.className='scrim';
    scrimEl.innerHTML=`<div class="sheet" role="dialog"><div class="sh-hd"><h2></h2><button class="x" data-act="close" aria-label="Закрыть">✕</button></div><div id="shb"></div></div>`;
    scrimEl.addEventListener('click',e=>{if(e.target==scrimEl)close()});document.body.appendChild(scrimEl)}
  scrimEl.querySelector('.sh-hd h2').innerHTML=title;scrimEl.querySelector('#shb').innerHTML=body;scrimEl.querySelector('.sheet').scrollTop=0;
}
function close(){if(scrimEl&&scrimEl.dataset.reg)return;if(scrimEl){scrimEl.remove();scrimEl=null}}
let toastT;
function toast(t,s){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=document.createElement('div');el.className='toast';el.innerHTML=t+(s?`<small>${s}</small>`:'');document.body.appendChild(el);clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),5000);el.onclick=()=>el.remove()}

/* выключить / пауза / включить */
function askToggle(id){
  const s=sub(id);
  if(s.state=='on'){
    const week=addDays(today(),7),first=new Date(today().getFullYear(),today().getMonth()+1,1);
    sheet(`Что сделать с ${esc(s.name)}?`,`<div class="stack">
      <button class="opt" data-pause="${id}" data-until="${week.getTime()}"><span class="e">⏸</span><span><b>Пауза на неделю</b><span class="muted">До ${fdate(week)}, потом включится сама</span></span></button>
      <button class="opt" data-pause="${id}" data-until="${first.getTime()}"><span class="e">⏸</span><span><b>Пауза до ${fdate(first)}</b><span class="muted">Если уезжаешь или не смотришь этот месяц</span></span></button>
      <button class="opt" data-do-off="${id}"><span class="e">⏻</span><span><b>Выключить</b><span class="muted">Пока не включишь — ни одного списания</span></span></button>
    </div><p class="note">Подписку в самом ${esc(s.name)} это не отменяет: сервис может закрыть доступ или пробовать списать снова. Мы каждый раз не пустим. <button class="lnk" data-act="howcancel">Как отменить в ${esc(s.name)} ›</button></p>`);
  }else{
    sheet(`Включить ${esc(s.name)}?`,`<p>${esc(s.name)} снова сможет списывать до ${rub(s.price)} в месяц</p><p class="muted">Если подписка в сервисе уже закончилась — продли её в самом ${esc(s.name)}</p><div class="stack"><button class="btn green" data-do-on="${id}">Включить</button><button class="btn ghost" data-act="close">Не надо</button></div>`);
  }
}
function setState(id,st,until){const s=sub(id);s.state=st;if(until)s.pauseUntil=until;else delete s.pauseUntil;
  S.ev.push({t:Date.now(),sub:id,k:st,until});save();close();render();
  toast(st=='on'?`${s.name} включена ✓`:st=='pause'?`${s.name} на паузе`:`${s.name} выключена`,st=='on'?'Списания снова пускаем':st=='pause'?'До '+fdate(until)+', потом включится сама':'Ни одного списания без твоего разрешения')}

/* подключение подписки: сервис → обычная цена → вставь карту */
let add={};
function addDraw(){
  const dots=`<div class="dots">${[1,2,3].map(i=>`<i class="${add.step==i?'on':''}"></i>`).join('')}</div>`;
  if(add.step==1){
    const used=new Set(S.subs.map(s=>s.svc));
    sheet('Какую подписку подключаем?',dots+`<div class="grid">${Object.entries(SVC).map(([k,v])=>`<button data-pick="${k}" ${used.has(k)?'disabled':''}>${logo({svc:k,name:v.name})}${esc(v.name)}</button>`).join('')}</div>
    <div class="field" style="margin-top:16px"><label for="own">Нет в списке? Напиши название</label><input id="own" placeholder="Например, Кинопоиск" autocomplete="off"></div><button class="btn" data-act="own">Дальше</button>`);
  }else if(add.step==2){
    const p=add.price;
    sheet(`Сколько стоит ${esc(add.name)}?`,dots+`<p>Это обычная цена. Захочет больше — не пустим и спросим тебя</p>
    <div class="field"><label for="pr">Рублей в месяц</label><input id="pr" type="number" inputmode="numeric" value="${p}" min="1"></div>
    <button class="btn" data-act="step3">Дальше</button>`);
  }else{
    sheet(`Вставь карту Шлюза в ${esc(add.name)}`,dots+cardBox(add.rev)+`
    ${add.rev?`<div class="stack" style="margin-top:12px">${copyRow('Номер',S.card.num)}${copyRow('Срок',S.card.exp)}${copyRow('CVC',S.card.cvc)}</div>`:`<button class="btn ghost" style="margin-top:12px" data-act="addreveal">Показать номер и скопировать</button>`}
    <div class="howto"><div>Открой ${esc(add.name)} → профиль → способы оплаты</div><div>Добавь карту Шлюза и сделай её основной</div><div>Удали там другие карты — иначе сервис может списать с них</div></div>
    <p class="note" style="margin-top:0">По первому списанию запомним, как ${esc(add.name)} выглядит в списаниях</p>
    <button class="btn green" data-act="done">Готово, карта вставлена</button>`);
  }
}

/* попытка списания (для показа) */
function charge(s,amt){
  let k='ok',why='';
  if(s.state=='off'){k='block';why=s.name+' выключена'}
  else if(s.state=='pause'){k='block';why='Пауза до '+fdate(s.pauseUntil)}
  else if(amt>s.price&&s.allowOnce!==amt){S.ev.forEach(e=>{if(e.sub==s.id&&e.k=='limit')e.open=false});S.ev.push({t:Date.now(),sub:s.id,k:'limit',amt,lim:s.price,open:true});save();render();toast(`✋ ${s.name} хочет ${rub(amt)}`,'Обычно '+rub(s.price)+'. Не пустили — ответь во вкладке «Что было»');return}
  if(k=='ok'&&S.wallet<amt){if(S.auto){const need=amt-S.wallet;S.wallet+=need;S.ev.push({t:Date.now()-1,k:'topup',amt:need,how:'Автопополнение с '+S.source.bank+' •• '+S.source.last4})}else{k='block';why='На карте не хватило денег — пополни, сервис попробует снова'}}
  if(k=='ok'){S.wallet-=amt;if(s.allowOnce===amt)delete s.allowOnce;else s.price=amt;if(!s.day)s.day=Math.min(28,today().getDate());if(trialOn(s))delete s.trial}
  S.ev.push({t:Date.now(),sub:s.id,k,amt,why,st:k=='ok'?'pending':undefined});save();render();if(k=='ok')setTimeout(settle,20000);
  k=='ok'?toast(`${s.name} списал ${rub(amt)} ✓`,'На карте осталось '+rub(S.wallet)):toast(`🛡 ${s.name} пытался списать ${rub(amt)}`,'Не пустили: '+why.charAt(0).toLowerCase()+why.slice(1));
}
function settle(){let ch=0;S.ev.forEach(e=>{if(e.st=='pending'&&Date.now()-e.t>=20000){e.st='done';ch=1}});if(ch){save();if(!scrimEl)render()}}
setInterval(settle,5000);

const DSP=[
  ['Заявка принята','Мы получили твою заявку'],
  ['Написали в сервис','Часто сервис возвращает деньги сам — ждём до 5 дней'],
  ['Оспариваем через банк','Сервис не вернул. Деньги временно вернули тебе, пока банк разбирается — до 90 дней'],
  ['Решено в твою пользу','Деньги остаются у тебя'],
];
function dTrack(t){const e=S.ev.find(x=>x.t==t);const s=sub(e.sub)||{name:'Сервис'};const st=e.stage||0;
  sheet('Спорное списание '+rub(e.amt),`<p class="muted">${esc(s.name)} · ${esc(e.why||'')}</p><div class="stack">${DSP.map((d,i)=>`<div class="trow" style="opacity:${i<=st?1:.45}"><span class="ic ${i<st?'ok':i==st?'pause':'info'}" style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none">${i<st?'✓':i+1}</span><div class="txt"><b style="font-size:15px">${d[0]}</b><span class="muted" style="font-size:13px">${d[1]}</span></div></div>`).join('')}</div>
  ${st<3?`<div class="demo"><p>Для показа</p><button data-dnext="${e.t}">▶ Следующий этап</button></div>`:''}`)}

/* регистрация */
let rg={};
function reg(n){const dots=`<div class="dots">${[1,2,3,4,5].map(i=>`<i class="${Math.min(n,5)==i?'on':''}"></i>`).join('')}</div>`;let t,b;
  if(n==1){t='Вход в Шлюз';b=`<p>Одна карта для всех подписок и переключатель у каждой</p><div class="field"><label for="ph">Номер телефона</label><input id="ph" type="tel" inputmode="tel" value="${rg.ph||'+7 '}" autocomplete="tel"></div><button class="btn" data-reg="2">Получить код по СМС</button><p class="note">Продолжая, соглашаешься с условиями Шлюза и банка, который выпускает карту</p>`}
  else if(n==2){t='Код из СМС';b=`<p>Отправили на ${esc(rg.ph)}</p><div class="field"><label for="cd">Код</label><input id="cd" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="one-time-code"></div><button class="btn" data-reg="3">Дальше</button>`}
  else if(n==3){t='Подтверди, что это ты';b=`<p>Карту выпускает банк, а он по закону должен знать владельца. Это один раз и займёт минуту</p><button class="btn" data-reg="4">Войти через Госуслуги</button><p class="note">Мы получим только имя, дату рождения и паспорт. Пароль от Госуслуг мы не видим</p>`}
  else if(n==4){t='Твоя карта готова ✓';b=`<p>Проверено: ${esc(S.me.full)}</p>${cardBox(false)}<p class="note">Одна виртуальная карта для всех подписок. Номер покажем, когда будешь вставлять её в сервис</p><button class="btn" style="margin-top:14px" data-reg="5">Дальше</button>`}
  else {t='Откуда пополнять карту?';b=`<p>Подойдёт карта любого банка. Можно и по СБП</p><div class="stack">${[['Т-Банк','1234'],['Сбер','5521'],['Альфа-Банк','0087']].map(([bk,l])=>`<button class="btn ghost" data-reg="6" data-bank="${bk}|${l}">${bk} •• ${l}</button>`).join('')}<button class="btn ghost" data-reg="6" data-bank="sbp">Буду пополнять по СБП</button></div>`}
  sheet(t,dots+b);scrimEl.dataset.reg=1;scrimEl.querySelector('.x').hidden=true;
}
function regStep(D){const n=+D.reg;
  if(n==2){let v=document.getElementById('ph').value.replace(/\D/g,'');if(v.length==10)v='7'+v;if(v.length==11&&v[0]=='8')v='7'+v.slice(1);if(v.length!=11||v[0]!='7'){toast('Проверь номер','Нужно 10 цифр после +7');return}rg.ph='+7 ('+v.slice(1,4)+') '+v.slice(4,7)+'-'+v.slice(7,9)+'-'+v.slice(9)}
  if(n==3){const v=document.getElementById('cd').value.replace(/\D/g,'');if(v.length!=4){toast('Нужно 4 цифры из СМС');return}}
  if(n==6){if(D.bank!='sbp'){const[b,l]=D.bank.split('|');S.source={bank:b,last4:l};S.auto=true}else S.auto=false;
    S.me.phone=rg.ph||S.me.phone;S.reg=true;S.onb=true;save();delete scrimEl.dataset.reg;close();render();onb(0);return}
  reg(n);
}

/* ---------- клики ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-sub]');if(!t||t.disabled)return;
  const D=t.dataset;
  if(D.reg)return regStep(D);
  if(D.tog){e.stopPropagation();return askToggle(D.tog)}
  if(D.doOff)return setState(D.doOff,'off');
  if(D.doOn)return setState(D.doOn,'on');
  if(D.pause)return setState(D.pause,'pause',+D.until);
  if(D.tab)return go(D.tab);
  if(D.go)return go(D.go);
  if(D.sub&&!D.tog)return openSub(D.sub);
  if(D.copy){const ok=()=>toast('Скопировано ✓'),bad=()=>toast('Не получилось скопировать','Выдели цифры пальцем и скопируй');try{navigator.clipboard.writeText(D.copy).then(ok,bad)}catch(_){bad()}return}
  if(D.once){const ev=S.ev.find(x=>x.t==+D.once);const s=sub(ev.sub);s.allowOnce=ev.amt;ev.open=false;ev.allowed=true;save();render();toast(`Пропустим ${s.name} один раз`,'Только '+rub(ev.amt)+'. Потом снова обычная цена '+rub(s.price));return}
  if(D.keep){const ev=S.ev.find(x=>x.t==+D.keep);ev.open=false;save();render();toast(`${sub(ev.sub).name}: ${rub(ev.amt)} не пускаем`,'Сервис может пробовать ещё — каждый раз не пустим');return}
  if(D.allow){const ev=S.ev.find(x=>x.t==+D.allow);ev.st='allowed';const v=SVC[ev.svc]||{name:ev.name,mid:ev.name};const id='s'+Date.now();S.subs.push({id,svc:ev.svc||'',name:v.name,price:ev.amt,mid:ev.name,state:'on',note:'',day:null,allowOnce:ev.amt});save();render();toast(`${v.name} добавлена в подписки ✓`,'Сервис сам повторит списание — в этот раз пропустим');return}
  if(D.deny){const ev=S.ev.find(x=>x.t==+D.deny);ev.st='denied';if(!S.denied.includes(ev.name))S.denied.push(ev.name);save();render();toast(`${ev.name} запрещён`,'Передумаешь — разрешишь в профиле');return}
  if(D.undeny){S.denied=S.denied.filter(n=>n!=D.undeny);save();render();toast(D.undeny+' больше не запрещён','В следующий раз спросим тебя');return}
  if(D.pick){const v=SVC[D.pick];add={step:2,svc:D.pick,name:v.name,price:v.price,mid:v.mid};return addDraw()}
  if(D.sim)return charge(sub(D.sim),+D.amt);
  if(D.refund){const s=sub(D.refund);S.wallet+=s.price;S.ev.push({t:Date.now(),sub:s.id,k:'refund',amt:s.price});save();render();toast(`${s.name} вернул ${rub(s.price)}`,'Деньги на карте Шлюза');return}
  if(D.dispute){const ev=S.ev.find(x=>x.t==+D.dispute);const s=sub(ev.sub)||{name:'Сервис'};
    if(ev.st=='pending')return sheet('Пока рано спорить',`<p>Списание ещё в обработке — сервис может сам его отменить. Спорить можно, когда его проведут, обычно через 1–3 дня</p><button class="btn" data-act="close">Понятно</button>`);
    if(Date.now()-ev.t>90*864e5)return sheet('Поздно спорить',`<p>Спорить можно в течение 90 дней после списания. Это было ${fdate(ev.t)}</p><button class="btn" data-act="close">Понятно</button>`);
    sheet(`Что не так со списанием ${rub(ev.amt)}?`,`<div class="stack">${['Не знаю, что это за списание','Списали больше, чем должны','Подписку уже отменили, а деньги взяли'].map(r=>`<button class="opt" data-disp="${ev.t}" data-why="${r}"><span class="e">•</span><span><b>${r}</b></span></button>`).join('')}</div><div class="field" style="margin-top:14px"><label for="dtx">Расскажи, что случилось (можно не писать)</label><input id="dtx" placeholder="Например, подписку отменили 3 ноября"></div><div class="field"><label for="dfile">Скриншот или чек, если есть</label><input id="dfile" type="file" accept="image/*,.pdf"></div><p class="note">${esc(s.name)} · ${fdate(ev.t)}<br>Не оспаривай это списание через свой банк — Шлюз тогда заморозят. Мы оспорим сами</p>`);return}
  if(D.disp){const ev=S.ev.find(x=>x.t==+D.disp);ev.disputed=true;const s=sub(ev.sub);S.ev.push({t:Date.now(),sub:ev.sub,k:'dispute',amt:ev.amt,why:D.why,stage:0});if(s&&s.state=='on'){s.state='pause';s.pauseUntil=addDays(today(),30).getTime()}save();
    sheet('Заявка принята ✓',`<p>Сначала напишем в ${esc(s?s.name:'сервис')} — часто этого хватает. Не вернут — оспорим через банк. Обычно до 30 дней</p><p class="muted">Пока разбираемся, ${esc(s?s.name:'подписка')} на паузе — новых списаний не будет</p><button class="btn" data-act="close">Понятно</button>`);render();return}
  if(D.dtrack)return dTrack(+D.dtrack);
  if(D.dnext){const e=S.ev.find(x=>x.t==+D.dnext);if(e.stage<3){e.stage++;if(e.stage==2){S.wallet+=e.amt;S.ev.push({t:Date.now(),sub:e.sub,k:'credit',amt:e.amt})}}save();render();dTrack(e.t);return}
  if(D.ntf){S.ntf[D.ntf]=!S.ntf[D.ntf];save();render();return}
  if(D.src){const[b,l]=D.src.split('|');S.source={bank:b,last4:l};save();close();render();toast('Пополняем с '+b+' •• '+l);return}
  if(D.topchip){document.getElementById('tsum').value=D.topchip;return}
  if(D.how){const v=+document.getElementById('tsum').value;if(!(v>0)){toast('Напиши сумму');return}S.wallet+=v;S.ev.push({t:Date.now(),k:'topup',amt:v,how:D.how=='sbp'?'По СБП':'С '+S.source.bank+' •• '+S.source.last4});save();close();render();toast('Карта пополнена на '+rub(v)+' ✓','Теперь на ней '+rub(S.wallet));return}
  if(D.reissued!=null){const s=sub(D.reissued);s.reinserted=!s.reinserted;save();reissueList();return}
  switch(D.act){
    case 'close':return close();
    case 'add':add={step:1};return addDraw();
    case 'own':{const v=(document.getElementById('own').value||'').trim();if(v.length<2){toast('Выбери сервис или напиши название');return}add={step:2,svc:'',name:v,price:299,mid:''};return addDraw()}
    case 'step3':{const p=+document.getElementById('pr').value;if(!(p>0)){toast('Напиши цену больше нуля');return}add.price=p;add.step=3;add.rev=false;return addDraw()}
    case 'addreveal':faceId(()=>{add.rev=true;addDraw()});return;
    case 'done':{const id='s'+Date.now();S.subs.push({id,svc:add.svc,name:add.name,price:add.price,mid:add.mid,state:'on',note:'',day:null});S.ev.push({t:Date.now(),sub:id,k:'add'});save();close();openSub(id);toast(`${add.name} подключена ✓`,'Ждём первое списание');return}
    case 'mycard':go('profile');return;
    case 'reveal':faceId(()=>{view.reveal=true;render()});return;
    case 'hide':view.reveal=false;return render();
    case 'price':{const s=sub(view.sub);sheet('Обычная цена '+esc(s.name),`<p>Больше этой суммы в месяц не пустим и спросим тебя</p><div class="field"><label for="pr2">Рублей в месяц</label><input id="pr2" type="number" inputmode="numeric" value="${s.price}"></div><button class="btn" data-act="pricesave">Сохранить</button>`);return}
    case 'pricesave':{const v=+document.getElementById('pr2').value;if(!(v>0)){toast('Напиши сумму больше нуля');return}sub(view.sub).price=v;save();close();render();toast('Обычная цена '+rub(v)+' ✓');return}
    case 'note':{const s=sub(view.sub);sheet('Заметка к подписке',`<p>Чтобы помнить, зачем эта подписка. Видишь только ты</p><div class="field"><label for="nt">Заметка</label><input id="nt" maxlength="40" value="${esc(s.note||'')}" placeholder="Например, мультики для Сони"></div><button class="btn" data-act="notesave">Сохранить</button>`);return}
    case 'notesave':{sub(view.sub).note=document.getElementById('nt').value.trim();save();close();render();toast('Заметка сохранена ✓');return}
    case 'howcancel':{const s=sub(view.sub)||{name:'сервисе'};sheet('Как отменить в '+esc(s.name),`<p>Выключение в Шлюзе не пускает списания. А чтобы сервис перестал считать тебя подписчиком, отмени подписку и в нём</p><div class="howto"><div>Открой ${esc(s.name)} → профиль</div><div>Найди «Подписка» или «Управление подпиской»</div><div>Нажми «Отменить» и подтверди</div></div><p class="note">У каждого сервиса путь немного свой — подсказки для популярных сервисов добавим</p><button class="btn" data-act="close">Понятно</button>`);return}
    case 'remove':{const s=sub(view.sub);sheet(`Убрать ${esc(s.name)} из Шлюза?`,`<p>Списания ${esc(s.name)} больше не пустим</p><p class="muted">Отменить саму подписку можно только в ${esc(s.name)}. Если сервис вернёт деньги — придут на карту Шлюза</p><div class="stack"><button class="btn red" data-act="rmok">Убрать</button><button class="btn ghost" data-act="close">Оставить</button></div>`);return}
    case 'rmok':{const s=sub(view.sub);S.ev.push({t:Date.now(),sub:s.id,k:'remove',name:s.name});S.denied.includes(s.mid)||!s.mid||S.denied.push(s.mid);S.subs=S.subs.filter(x=>x!=s);save();close();go('home');toast(`${s.name} убрана`,'Списания больше не пускаем');return}
    case 'topup':{const P=monthPlan();sheet('Пополнить карту',`<div class="field"><label for="tsum">Сколько, ₽</label><input id="tsum" type="number" inputmode="numeric" value="${P.lack||1000}"></div><div class="chips">${[...new Set([P.lack,500,1000,2000].filter(Boolean))].map(v=>`<button data-topchip="${v}">${v==P.lack?'Не хватает '+rub(v):rub(v)}</button>`).join('')}</div><div class="stack"><button class="btn" data-how="sbp">По СБП<small>Без комиссии, из приложения своего банка</small></button><button class="btn ghost" data-how="card">С карты ${esc(S.source.bank)} •• ${S.source.last4}<small>Без комиссии</small></button></div>`);return}
    case 'auto':S.auto=!S.auto;save();render();toast(S.auto?'Автопополнение включено ✓':'Автопополнение выключено',S.auto?'Не хватит на списание — за день доложим недостающее':'Следи, чтобы на карте хватало денег');return;
    case 'source':sheet('Откуда пополнять',`<p>Можно карту любого банка</p><div class="stack">${[['Т-Банк','1234'],['Сбер','5521'],['Альфа-Банк','0087']].map(([b,l])=>`<button class="btn ${S.source.last4==l?'':'ghost'}" data-src="${b}|${l}">${b} •• ${l}${S.source.last4==l?' ✓':''}</button>`).join('')}</div>`);return;
    case 'reissue':sheet('Новая карта?',`<p>Старая карта сразу перестанет работать — по утёкшему номеру никто не спишет</p><p class="muted">Новый номер нужно будет вставить во все подписки: ${S.subs.length}. Дадим список, чтобы ничего не забыть</p><div class="stack"><button class="btn red" data-act="reissueok">Закрыть старую и выпустить новую</button><button class="btn ghost" data-act="close">Не надо</button></div>`);return;
    case 'reissueok':S.card=mkCard();S.subs.forEach(s=>s.reinserted=false);S.ev.push({t:Date.now(),k:'reissue'});save();view.reveal=false;render();reissueList();return;
    case 'simunknown':{const free=Object.entries(SVC).filter(([k,v])=>!S.subs.some(s=>s.svc==k)&&!S.denied.includes(v.mid));if(!free.length){toast('Все сервисы уже в списке');return}const[k,v]=free[Math.floor(Math.random()*free.length)];S.ev.push({t:Date.now(),k:'unknown',name:v.mid,amt:v.price,st:'ask',svc:k});save();render();toast(`🛡 Новый сервис ${v.mid} хочет ${rub(v.price)}`,'Не пустили. Разреши, если это твоя подписка');return}
    case 'closeacc':sheet('Закрыть Шлюз?',`<p>Карта закроется сразу — ни один сервис больше не спишет. Остаток ${rub(S.wallet)} вернём на ${esc(S.source.bank)} •• ${S.source.last4} за 1–3 дня</p><p class="muted">Данные по закону храним 5 лет, потом удаляем</p><div class="stack"><button class="btn red" data-act="closeaccok">Закрыть Шлюз</button><button class="btn ghost" data-act="close">Остаться</button></div>`);return;
    case 'closeaccok':S=seed();save();close();go('home');reg(1);return;
    case 'logout':sheet('Выйти из Шлюза?','<p>Карта и переключатели продолжат работать как настроены. Вернёшься по номеру и коду из СМС</p><div class="stack"><button class="btn red" data-act="logoutok">Выйти</button><button class="btn ghost" data-act="close">Остаться</button></div>');return;
    case 'logoutok':S.reg=false;save();close();reg(1);return;
    case 'onb':return onb(0);
    case 'onbnext':return onb(+D.n);
    case 'onbdone':return close();
    case 'reset':S=seed();S.onb=true;S.reg=true;save();close();go('home');toast('Демо началось заново');return;
    case 'faceok':{close();const f=faceCb;faceCb=null;f&&f();return}
  }
});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close();if((e.key=='Enter'||e.key==' ')&&e.target.matches('.row[data-sub]')){e.preventDefault();openSub(e.target.dataset.sub)}});

let faceCb=null;
function faceId(cb){faceCb=cb;sheet('Покажем номер карты','<div class="faceid"><i>☺</i><span class="muted">Подтверди, что это ты</span></div><button class="btn" data-act="faceok">Подтвердить по лицу</button>')}
function reissueList(){sheet('Вставь новую карту',`<p>Отмечай, куда новая карта уже вставлена. Номер — в профиле, «Показать»</p><div class="panel" style="margin-top:0;box-shadow:none;background:var(--surface2)">${S.subs.map(s=>`<div class="chk">${logo(s)}<span>${esc(s.name)}</span><button class="sw ${s.reinserted?'on':''}" role="switch" aria-checked="${!!s.reinserted}" aria-label="${esc(s.name)}: вставлена" data-reissued="${s.id}"></button></div>`).join('')}</div><button class="btn" style="margin-top:14px" data-act="close">${S.subs.every(s=>s.reinserted)?'Везде вставлена ✓':'Закончу позже'}</button>`)}

const ONB=[
  ['💳','Одна карта для всех подписок','Виртуальная, прямо в приложении. Вставляешь её в Okko, Иви, Яндекс Плюс — и все подписки видны здесь'],
  ['🔘','Выключил — и больше не спишут','У каждой подписки свой переключатель. Не надо искать, где в сервисе спрятана кнопка «Отменить»'],
  ['✋','Дороже — спросим тебя','Сервис поднял цену — не пустим и спросим. Пропустить один раз или нет — решаешь ты'],
  ['🛡️','Новый сервис — тоже спросим','Незнакомым списаниям по умолчанию отказываем. Даже если номер карты утечёт'],
];
function onb(i){const[p,h,t]=ONB[i];sheet('Знакомство',`<div class="dots">${ONB.map((_,j)=>`<i class="${i==j?'on':''}"></i>`).join('')}</div><div class="onb-pic">${p}</div><h2 style="margin-bottom:8px">${h}</h2><p class="muted">${t}</p>${i<ONB.length-1?`<button class="btn" data-act="onbnext" data-n="${i+1}">Дальше</button>`:`<button class="btn" data-act="onbdone">Начать</button>`}`)}

settle();render();
if(!S.reg)reg(1);else if(!S.onb){S.onb=true;save();onb(0)}
</script>
</body>
</html>
